name: ScreenX AI - Phase 13 release readiness

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.SCREENX_KEYSTORE_BASE64 != '' && secrets.SCREENX_KEYSTORE_PASSWORD != '' && secrets.SCREENX_KEY_ALIAS != '' && secrets.SCREENX_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and lint
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:lintRelease --stacktrace

      - name: Configure optional release signing
        if: ${{ env.HAS_RELEASE_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SCREENX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screenx-release.jks"
          chmod 600 "$RUNNER_TEMP/screenx-release.jks"

      - name: Build release APK
        env:
          SCREENX_KEYSTORE_PATH: ${{ runner.temp }}/screenx-release.jks
          SCREENX_KEYSTORE_PASSWORD: ${{ secrets.SCREENX_KEYSTORE_PASSWORD }}
          SCREENX_KEY_ALIAS: ${{ secrets.SCREENX_KEY_ALIAS }}
          SCREENX_KEY_PASSWORD: ${{ secrets.SCREENX_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK and create SHA-256 checksum
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          if [ "${HAS_RELEASE_SIGNING}" = "true" ]; then
            echo 'Signing credentials were supplied to the Gradle release build.'
          else
            echo 'No signing keystore secret supplied: APK is unsigned.'
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenx-phase13-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
