name: ScreenX AI - Phase 23 stability, compatibility and release verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Phase 23 stability audit
        run: ./scripts/phase23-stability-audit.sh

      - name: Run Phase 22 build-readiness audit
        run: ./scripts/phase22-build-audit.sh
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Run Android Lint
        run: gradle :app:lintDebug :app:lintRelease --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK archives, debug signature, and checksums
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK='app/build/outputs/apk/debug/app-debug.apk'
          RELEASE_APK='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          unzip -t "$DEBUG_APK" >/dev/null
          unzip -t "$RELEASE_APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEBUG_APK"
          mkdir -p build-artifacts
          cp "$DEBUG_APK" "$RELEASE_APK" build-artifacts/
          sha256sum build-artifacts/*.apk | tee build-artifacts/SHA256SUMS.txt
      - name: Upload APKs, checksums, test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenx-phase23-build-results
          if-no-files-found: warn
          path: |
            build-artifacts/*
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/test-results/testDebugUnitTest/**/*.xml
